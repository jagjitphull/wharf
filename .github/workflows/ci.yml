name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing in this workflow writes to the repository, so the token it runs with
# shouldn't be able to either (the repo-wide default may be read/write).
permissions:
  contents: read

jobs:
  build:
    name: Lint, typecheck, test, build, and package (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      # Exercises scripts/verify-pty.js for real here too: node-pty has no
      # prebuilt binary for Linux, so this is the same native compile (and
      # the same postinstall check) an actual release build depends on.
      - name: Install dependencies
        run: npm ci

      # What ships in the app. Fails on a high or critical advisory in a runtime
      # dependency; dev-only findings (build tooling) are tracked in the README.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # electron-builder.yml's own linux.target (AppImage + deb) applies
      # here with no extra flags — this is the actual release artifact
      # pipeline, not just a compile check, so a packaging regression
      # (icon/resources paths, asar contents, native module ABI) fails CI
      # instead of being discovered on a real release.
      - name: Package
        run: npm run package

      # Launches the unpacked build that Package just produced under a
      # virtual display and drives it: UI mounts, preload/IPC works, a local
      # shell (node-pty) runs a command, nothing throws, and it quits
      # cleanly. See scripts/smoke-test.mjs. --no-sandbox because the
      # unpacked chrome-sandbox isn't setuid root here.
      - name: Install smoke-test display and audio libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: Smoke test the packaged app
        env:
          SMOKE_NO_SANDBOX: "1"
          SMOKE_SCREENSHOT: ${{ runner.temp }}/smoke-screenshot.png
        run: xvfb-run -a --server-args="-screen 0 1280x800x24" npm run smoke -- release/linux-unpacked/wharf

      - name: Upload smoke-test screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-screenshot-${{ github.sha }}
          path: ${{ runner.temp }}/smoke-screenshot.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Linux build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wharf-linux-${{ github.sha }}
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 14

  # The same checks on Windows and macOS. Wharf is only released for Linux, so
  # this is about not breaking the others by accident, and about knowing what
  # actually works there: the unit tests, the production build, and an
  # *unsigned* package (signing and notarization are what shipping a Windows
  # or macOS build would additionally need, and aren't set up).
  cross-platform:
    name: Typecheck, test, build and package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Package (unsigned)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run package

      # Launches the unpacked build the package step just produced (the default
      # path for each platform) and drives it, as on Linux: the UI mounts,
      # preload/IPC works, a local shell runs a command, nothing throws, it
      # quits cleanly.
      - name: Smoke test the packaged app
        env:
          SMOKE_SCREENSHOT: ${{ runner.temp }}/smoke-screenshot.png
        run: npm run smoke

      # Only runs when the smoke test failed on macOS: is the bundle's signature
      # intact (flipping fuses edits the binary), and what does launching it say?
      - name: Diagnose a failed macOS launch
        if: failure() && runner.os == 'macOS'
        continue-on-error: true
        run: |
          APP=release/mac-arm64/Wharf.app
          echo "--- codesign verify"; codesign --verify --deep --strict --verbose=2 "$APP" 2>&1 || true
          echo "--- codesign details"; codesign -dv --verbose=2 "$APP" 2>&1 | head -12 || true
          echo "--- launching directly for 15s"
          "$APP/Contents/MacOS/Wharf" --remote-debugging-port=9333 --disable-gpu --user-data-dir="$RUNNER_TEMP/diag" > "$RUNNER_TEMP/diag.log" 2>&1 &
          PID=$!
          sleep 15
          echo "alive: $(kill -0 $PID 2>/dev/null && echo yes || echo no)"
          curl -s --max-time 5 http://127.0.0.1:9333/json/version || echo "no debugger answer"
          kill $PID 2>/dev/null || true
          echo "--- app output"; tail -30 "$RUNNER_TEMP/diag.log"
          echo "--- recent crash reports"; ls -t ~/Library/Logs/DiagnosticReports 2>/dev/null | head -3

      - name: Upload smoke-test screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-screenshot-${{ matrix.name }}-${{ github.sha }}
          path: ${{ runner.temp }}/smoke-screenshot.png
          if-no-files-found: ignore
          retention-days: 7
