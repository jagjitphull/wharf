appId: com.wharf.app
productName: Wharf
# ssh2's two native add-ons (cpu-features, its bundled sshcrypto.node) are
# both optional performance boosts — ssh2 wraps requiring each in try/catch
# and falls back to pure-JS crypto if either is missing or fails to load
# (e.g. compiled against a different Node ABI than Electron's). Nothing else
# in the dependency tree is native, so skipping electron-builder's rebuild
# step is safe and avoids it needing network access to Electron's headers.
npmRebuild: false
directories:
  output: release
  buildResources: resources
files:
  - dist-electron/**/*
  - package.json
# BrowserWindow's runtime `icon` option (see src/main/index.ts) reads this at
# app.isPackaged time via process.resourcesPath — needed because Linux window
# managers don't reliably pick up the hicolor-theme icon below for an
# AppImage's own running window, only for its launcher/taskbar pin.
# Electron "fuses": switches flipped in the packaged binary itself, which can't
# be changed afterwards without re-signing/re-writing it. Out of the box the
# binary will run arbitrary JavaScript as a plain Node.js process when
# ELECTRON_RUN_AS_NODE is set, honor NODE_OPTIONS, and open a debugger on
# --inspect, none of which Wharf uses (nothing here forks Electron as Node;
# verify-pty.js runs against the *installed* electron, which isn't fused).
# Left at their defaults on purpose: grantFileProtocolExtraPrivileges (the UI
# is loaded from file://, so it needs them) and
# enableEmbeddedAsarIntegrityValidation (not supported on Linux).
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  enableCookieEncryption: true
extraResources:
  - from: resources/icons
    to: icons
mac:
  category: public.app-category.developer-tools
  icon: resources/icon.icns
  target:
    - dmg
win:
  icon: resources/icon.ico
  target:
    - nsis
linux:
  target:
    - AppImage
    - deb
  category: Development
  maintainer: Wharf <noreply@example.com>
  # A directory of size-named PNGs (16x16.png … 1024x1024.png) instead of a
  # single flat icon.png — electron-builder installs these into the correct
  # hicolor/<size>/apps directories. With just one flat PNG it couldn't
  # detect the size and fell back to an invalid "hicolor/0x0/apps" bucket
  # that GTK icon theme lookups don't recognize.
  icon: resources/icons
  # Keeps the generated .desktop file's name in sync with `desktopName`
  # (package.json) — that's what Electron itself uses as app_id/WM_CLASS at
  # runtime, so without this a window can't be linked back to its launcher
  # entry (wrong taskbar grouping/icon, "pin to taskbar" not working).
  syncDesktopName: true
  synopsis: A personal SSH/SFTP terminal client
