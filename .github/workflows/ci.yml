name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    name: Typecheck, build, and package (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # Exercises scripts/verify-pty.js for real here too: node-pty has no
      # prebuilt binary for Linux, so this is the same native compile (and
      # the same postinstall check) an actual release build depends on.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # electron-builder.yml's own linux.target (AppImage + deb) applies
      # here with no extra flags — this is the actual release artifact
      # pipeline, not just a compile check, so a packaging regression
      # (icon/resources paths, asar contents, native module ABI) fails CI
      # instead of being discovered on a real release.
      - name: Package
        run: npm run package

      - name: Upload Linux build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wharf-linux-${{ github.sha }}
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 14
